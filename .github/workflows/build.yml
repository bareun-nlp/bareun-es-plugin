# 대상 Elasticsearch 버전마다 빌드하고 단위 테스트를 돌린다.
#
# Elasticsearch 는 플러그인 descriptor 의 elasticsearch.version 이 노드 버전과
# 정확히 같아야 로드하므로, 하나의 산출물로 여러 버전을 지원할 수 없다. 그래서
# 대상 버전이 그대로 빌드 축이 된다.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - es: 8.19.21
            java: '17'
            profile: ''
          - es: 9.5.2
            java: '21'
            profile: '-Pes9'
    name: es ${{ matrix.es }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - run: mvn -B ${{ matrix.profile }} verify

      - uses: actions/upload-artifact@v4
        with:
          name: elasticsearch-analysis-bareun-es${{ matrix.es }}
          path: target/releases/*.zip
